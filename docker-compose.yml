version: '3.9'

services:
  frontend:
    build: ./frontend
    container_name: frontend
    expose:
      - 80
    

  backend:
    build: ./social_lab
    container_name: backend
    env_file:
      - .env
    expose:
      - 8000:8000
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./social_lab/media:/media
    depends_on:
      - frontend
      - backend
