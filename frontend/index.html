<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialApp - Home</title>
    <link href="./css/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content -->
    <div class="pt-16 pb-20 md:pb-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex">
                <!-- Sidebar (Desktop) -->
                <div class="hidden md:block w-64 flex-shrink-0">
                    <div id="sidebar-placeholder"></div>
                </div>

                <!-- Feed -->
                <div class="flex-1 max-w-2xl mx-auto">
                    <!-- Create Post Card -->
                    <div class="card p-4 mb-4">
                        <div class="flex items-center space-x-3">
                            <img src="/images/placeholder-avatar.jpg" alt="Your profile" class="w-10 h-10 rounded-full">
                            <button 
                                onclick="window.location.href='/create-post.html'"
                                class="flex-1 text-left px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-full text-gray-500 transition-all duration-200"
                            >
                                What's on your mind?
                            </button>
                        </div>
                    </div>

                    <!-- Posts Container -->
                    <div id="postsContainer" class="space-y-4">
                        <!-- Posts will be loaded here -->
                    </div>

                    <!-- Load More Button -->
                    <div class="text-center mt-8">
                        <button id="loadMoreBtn" class="btn-secondary" style="display: none;">
                            Load More Posts
                        </button>
                    </div>
                </div>

                <!-- Right Sidebar (Desktop) -->
                <div class="hidden lg:block w-80 flex-shrink-0 ml-8">
                    <div class="card p-6">
                        <h3 class="font-semibold text-gray-900 mb-4">Suggestions</h3>
                        <!-- Suggestions will go here -->
                        <div class="space-y-4">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <img src="/images/placeholder-avatar.jpg" alt="User" class="w-8 h-8 rounded-full">
                                    <span class="text-sm font-medium">username</span>
                                </div>
                                <button class="text-blue-600 text-sm font-medium hover:text-blue-700">Follow</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Create Post Button (Mobile) -->
    <button 
        id="createPostBtn"
        class="fixed bottom-20 right-4 md:hidden w-14 h-14 bg-blue-600 text-white rounded-full shadow-lg hover:bg-blue-700 transition-all duration-200 flex items-center justify-center"
    >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
    </button>

    <!-- Mobile Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 md:hidden">
        <div class="flex justify-around items-center h-16">
            <a href="/index.html" class="text-blue-600">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
            </a>
            <a href="/search.html" class="text-gray-600">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </a>
            <a href="/messages.html" class="text-gray-600">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
            </a>
            <a href="/profile.html" class="text-gray-600">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </a>
        </div>
    </div>

    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/posts.js"></script>
</body>
</html>
