<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialApp - Create Post</title>
    <link href="./css/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content -->
    <div class="pt-16 pb-8">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="card p-6">
                <h1 class="text-2xl font-bold text-gray-900 mb-6">Create New Post</h1>
                
                <form id="createPostForm" class="space-y-6">
                    <!-- Image Upload -->
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center">
                        <div id="imagePreview" class="mb-4 hidden">
                            <img src="" alt="Preview" class="max-h-96 mx-auto rounded-lg">
                        </div>
                        
                        <div id="uploadArea" class="cursor-pointer">
                            <svg class="w-12 h-12 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                            <p class="text-lg font-medium text-gray-900">Upload a photo</p>
                            <p class="text-sm text-gray-500">PNG, JPG, GIF up to 10MB</p>
                            <input 
                                type="file" 
                                id="image" 
                                name="image" 
                                accept="image/*" 
                                class="hidden"
                                required
                            >
                        </div>
                    </div>

                    <!-- Caption -->
                    <div>
                        <label for="caption" class="block text-sm font-medium text-gray-700 mb-1">Caption</label>
                        <textarea 
                            id="caption" 
                            name="caption" 
                            rows="4" 
                            class="input-field"
                            placeholder="Write a caption..."
                        ></textarea>
                    </div>

                    <!-- Submit Buttons -->
                    <div class="flex space-x-4 pt-4">
                        <button type="button" onclick="window.history.back()" class="btn-secondary flex-1">
                            Cancel
                        </button>
                        <button type="submit" id="submitBtn" class="btn-primary flex-1">
                            Create Post
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/create-post.js"></script>
</body>
</html>
