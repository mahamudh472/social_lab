<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialApp - Login</title>
    <link href="./css/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <!-- Header -->
        <div class="text-center">
            <div class="flex justify-center">
                <div class="w-12 h-12 bg-blue-600 rounded-lg"></div>
            </div>
            <h2 class="mt-6 text-3xl font-bold text-gray-900">Sign in to your account</h2>
            <p class="mt-2 text-sm text-gray-600">
                Or <a href="/register.html" class="font-medium text-blue-600 hover:text-blue-500">create a new account</a>
            </p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="mt-8 space-y-6 card p-8">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username or Email</label>
                <input 
                    id="username"
                    name="username"
                    type="text" 
                    required 
                    class="input-field"
                    placeholder="Enter your username or email"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input 
                    id="password"
                    name="password"
                    type="password" 
                    required 
                    class="input-field"
                    placeholder="Enter your password"
                >
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input 
                        id="remember-me"
                        name="remember-me"
                        type="checkbox" 
                        class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                    >
                    <label for="remember-me" class="ml-2 block text-sm text-gray-900">Remember me</label>
                </div>

                <div class="text-sm">
                    <a href="/forgot-password.html" class="font-medium text-blue-600 hover:text-blue-500">Forgot password?</a>
                </div>
            </div>

            <div>
                <button type="submit" class="w-full btn-primary py-3">
                    Sign in
                </button>
            </div>
        </form>

        <!-- Demo Credentials -->
        <div class="text-center text-sm text-gray-600">
            <p>Demo: username: demo, password: demo123</p>
        </div>
    </div>

    <script type="module" src="/js/auth.js"></script>
</body>
</html>
