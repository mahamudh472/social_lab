<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialApp - Post</title>
    <link href="./css/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content -->
    <div class="pt-16 pb-8">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="card">
                <div class="md:flex">
                    <!-- Post Image -->
                    <div class="md:w-1/2 bg-black flex items-center justify-center post-image">
                        <!-- Image will be loaded here -->
                    </div>
                    
                    <!-- Post Details -->
                    <div class="md:w-1/2 flex flex-col">
                        <!-- Post Header -->
                        <div class="p-4 border-b border-gray-200 post-header">
                            <!-- Header will be loaded here -->
                        </div>
                        
                        <!-- Comments Section -->
                        <div class="flex-1 p-4 overflow-y-auto max-h-96">
                            <!-- Caption -->
                            <div class="post-caption">
                                <!-- Caption will be loaded here -->
                            </div>
                            
                            <!-- Comments -->
                            <div id="commentsContainer" class="space-y-4">
                                <!-- Comments will be loaded here -->
                            </div>
                        </div>
                        
                        <!-- Post Actions -->
                        <div class="p-4 border-t border-gray-200 space-y-3">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-4">
                                    <button class="post-like-btn text-gray-600 hover:text-red-500">
                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                                        </svg>
                                    </button>
                                    <button class="text-gray-600 hover:text-gray-800">
                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                                        </svg>
                                    </button>
                                    <button class="text-gray-600 hover:text-gray-800">
                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            
                            <p class="text-sm font-semibold text-gray-900 likes-count">0 likes</p>
                            <p class="text-xs text-gray-500 post-timestamp">Just now</p>
                        </div>
                        
                        <!-- Add Comment -->
                        <div class="p-4 border-t border-gray-200">
                            <form class="flex space-x-2 comment-form">
                                <input 
                                    type="text" 
                                    placeholder="Add a comment..." 
                                    class="flex-1 border-0 focus:ring-0 text-sm py-2 px-0 bg-transparent"
                                >
                                <button type="submit" class="text-blue-600 text-sm font-semibold hover:text-blue-700">Post</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/post-detail.js"></script>
</body>
</html>
