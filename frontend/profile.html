<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialApp - Profile</title>
    <link href="./css/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content -->
    <div class="pt-16 pb-20 md:pb-0">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <!-- Profile Header -->
            <div class="card p-8 mb-6">
                <div class="flex flex-col md:flex-row items-center md:items-start space-y-6 md:space-y-0 md:space-x-8">
                    <!-- Profile Picture -->
                    <div class="flex-shrink-0">
                        <img 
                            id="profileImage"
                            src="/images/placeholder-avatar.jpg" 
                            alt="Profile" 
                            class="w-32 h-32 rounded-full object-cover border-4 border-white shadow-lg"
                        >
                    </div>
                    
                    <!-- Profile Info -->
                    <div class="flex-1 text-center md:text-left">
                        <div class="flex flex-col md:flex-row md:items-center md:space-x-6 mb-4">
                            <h1 id="profileUsername" class="text-2xl font-bold text-gray-900">Loading...</h1>
                            <div class="flex items-center space-x-4 mt-2 md:mt-0">
                                <button id="editProfileBtn" class="btn-secondary text-sm">
                                    Edit Profile
                                </button>
                                <button id="followBtn" class="btn-primary text-sm hidden">
                                    Follow
                                </button>
                                <button class="p-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        
                        <!-- Stats -->
                        <div class="flex justify-center md:justify-start space-x-8 mb-4">
                            <div class="text-center">
                                <span id="postsCount" class="block font-bold text-gray-900">0</span>
                                <span class="text-sm text-gray-600">Posts</span>
                            </div>
                            <div class="text-center cursor-pointer" id="followersSection">
                                <span id="followersCount" class="block font-bold text-gray-900">0</span>
                                <span class="text-sm text-gray-600">Followers</span>
                            </div>
                            <div class="text-center cursor-pointer" id="followingSection">
                                <span id="followingCount" class="block font-bold text-gray-900">0</span>
                                <span class="text-sm text-gray-600">Following</span>
                            </div>
                        </div>
                        
                        <!-- Bio -->
                        <div id="profileBio" class="text-gray-800">
                            <p class="text-gray-500 italic">Loading...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Posts Grid -->
            <div class="mb-6">
                <div class="flex items-center justify-center border-b border-gray-200">
                    <button class="px-4 py-3 font-medium text-gray-900 border-b-2 border-gray-900">
                        <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                        </svg>
                        Posts
                    </button>
                </div>
                
                <!-- Posts Grid -->
                <div id="postsGrid" class="grid grid-cols-3 gap-1 mt-4">
                    <!-- Posts will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 md:hidden">
        <div class="flex justify-around items-center h-16">
            <a href="/index.html" class="text-gray-600">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
            </a>
            <a href="/search.html" class="text-gray-600">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </a>
            <a href="/create-post.html" class="text-gray-600">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
            </a>
            <a href="/messages.html" class="text-gray-600">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
            </a>
            <a href="/profile.html" class="text-blue-600">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </a>
        </div>
    </div>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/profile.js"></script>
</body>
</html>
