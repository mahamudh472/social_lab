<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialApp - Notifications</title>
    <link href="./css/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content -->
    <div class="pt-16 pb-20 md:pb-0">
        <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">Notifications</h1>
            
            <div class="space-y-4">
                <!-- Notification Items -->
                <div class="card p-4">
                    <div class="flex items-start space-x-3">
                        <img src="/images/placeholder-avatar.jpg" alt="User" class="w-10 h-10 rounded-full">
                        <div class="flex-1">
                            <p class="text-gray-900">
                                <span class="font-semibold">alice</span> liked your post
                            </p>
                            <p class="text-sm text-gray-500">2 hours ago</p>
                        </div>
                        <img src="https://picsum.photos/100/100?random=1" alt="Post" class="w-12 h-12 rounded">
                    </div>
                </div>

                <div class="card p-4">
                    <div class="flex items-start space-x-3">
                        <img src="/images/placeholder-avatar.jpg" alt="User" class="w-10 h-10 rounded-full">
                        <div class="flex-1">
                            <p class="text-gray-900">
                                <span class="font-semibold">bob</span> started following you
                            </p>
                            <p class="text-sm text-gray-500">5 hours ago</p>
                        </div>
                        <button class="btn-primary text-sm px-4 py-1">
                            Follow Back
                        </button>
                    </div>
                </div>

                <div class="card p-4">
                    <div class="flex items-start space-x-3">
                        <img src="/images/placeholder-avatar.jpg" alt="User" class="w-10 h-10 rounded-full">
                        <div class="flex-1">
                            <p class="text-gray-900">
                                <span class="font-semibold">charlie</span> commented on your post: "Great photo!"
                            </p>
                            <p class="text-sm text-gray-500">1 day ago</p>
                        </div>
                        <img src="https://picsum.photos/100/100?random=2" alt="Post" class="w-12 h-12 rounded">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 md:hidden">
        <div class="flex justify-around items-center h-16">
            <a href="/index.html" class="text-gray-600">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
            </a>
            <a href="/search.html" class="text-gray-600">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </a>
            <a href="/create-post.html" class="text-gray-600">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
            </a>
            <a href="/notifications.html" class="text-blue-600">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                </svg>
            </a>
            <a href="/profile.html" class="text-gray-600">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </a>
        </div>
    </div>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
