<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialApp - Forgot Password</title>
    <link href="./css/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <!-- Header -->
        <div class="text-center">
            <div class="flex justify-center">
                <div class="w-12 h-12 bg-blue-600 rounded-lg"></div>
            </div>
            <h2 class="mt-6 text-3xl font-bold text-gray-900">Reset your password</h2>
            <p class="mt-2 text-sm text-gray-600">
                Enter your email to receive a reset link
            </p>
        </div>

        <!-- Forgot Password Form -->
        <form class="mt-8 space-y-6 card p-8">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input 
                    id="email"
                    name="email"
                    type="email" 
                    required 
                    class="input-field"
                    placeholder="Enter your email"
                >
            </div>

            <div>
                <button type="submit" class="w-full btn-primary py-3">
                    Send Reset Link
                </button>
            </div>

            <div class="text-center">
                <a href="/login.html" class="text-sm text-blue-600 hover:text-blue-500">Back to login</a>
            </div>
        </form>
    </div>
</body>
</html>
