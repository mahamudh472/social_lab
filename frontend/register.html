<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialApp - Register</title>
    <link href="./css/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <!-- Header -->
        <div class="text-center">
            <div class="flex justify-center">
                <div class="w-12 h-12 bg-blue-600 rounded-lg"></div>
            </div>
            <h2 class="mt-6 text-3xl font-bold text-gray-900">Create your account</h2>
            <p class="mt-2 text-sm text-gray-600">
                Or <a href="/login.html" class="font-medium text-blue-600 hover:text-blue-500">sign in to existing account</a>
            </p>
        </div>

        <!-- Register Form -->
        <form id="registerForm" class="mt-8 space-y-6 card p-8">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input 
                    id="username"
                    name="username"
                    type="text" 
                    required 
                    class="input-field"
                    placeholder="Choose a username"
                >
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input 
                    id="email"
                    name="email"
                    type="email" 
                    required 
                    class="input-field"
                    placeholder="Enter your email"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input 
                    id="password"
                    name="password"
                    type="password" 
                    required 
                    class="input-field"
                    placeholder="Create a password"
                >
            </div>

            <div>
                <label for="password2" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input 
                    id="password2"
                    name="password2"
                    type="password" 
                    required 
                    class="input-field"
                    placeholder="Confirm your password"
                >
            </div>

            <div>
                <label for="profile_picture" class="block text-sm font-medium text-gray-700 mb-1">Profile Picture (Optional)</label>
                <input 
                    id="profile_picture"
                    name="profile_picture"
                    type="file" 
                    accept="image/*"
                    class="input-field"
                >
            </div>

            <div class="flex items-center">
                <input 
                    id="terms"
                    name="terms"
                    type="checkbox" 
                    required
                    class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                >
                <label for="terms" class="ml-2 block text-sm text-gray-900">
                    I agree to the <a href="#" class="text-blue-600 hover:text-blue-500">Terms and Conditions</a>
                </label>
            </div>

            <div>
                <button type="submit" class="w-full btn-primary py-3">
                    Create Account
                </button>
            </div>
        </form>
    </div>

    <script type="module" src="/js/auth.js"></script>
</body>
</html>
