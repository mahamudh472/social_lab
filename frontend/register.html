<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialApp - Register</title>
    <link href="./css/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <!-- Header -->
        <div class="text-center">
            <div class="flex justify-center">
                <div class="w-12 h-12 bg-blue-600 rounded-lg"></div>
            </div>
            <h2 class="mt-6 text-3xl font-bold text-gray-900">Create your account</h2>
            <p class="mt-2 text-sm text-gray-600">
                Or <a href="/login.html" class="font-medium text-blue-600 hover:text-blue-500">sign in to existing account</a>
            </p>
        </div>

        <!-- Register Form -->
        <form id="registerForm" class="mt-8 space-y-6 card p-8">
            <div id="errorContainer" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded relative" role="alert">
                <span id="errorMessage" class="block sm:inline"></span>
            </div>

            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input 
                    id="username"
                    name="username"
                    type="text" 
                    required 
                    class="input-field"
                    placeholder="Choose a username (min. 3 characters)"
                    autocomplete="username"
                >
                <p class="text-xs text-gray-500 mt-1">Username must be unique and at least 3 characters long</p>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email (Optional)</label>
                <input 
                    id="email"
                    name="email"
                    type="email" 
                    class="input-field"
                    placeholder="Enter your email (optional)"
                    autocomplete="email"
                >
                <p class="text-xs text-gray-500 mt-1">Email is optional but recommended for account recovery</p>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input 
                    id="password"
                    name="password"
                    type="password" 
                    required 
                    class="input-field"
                    placeholder="Create a strong password"
                    autocomplete="new-password"
                >
                <p class="text-xs text-gray-500 mt-1">Password must be at least 8 characters long</p>
            </div>

            <div>
                <label for="password2" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input 
                    id="password2"
                    name="password2"
                    type="password" 
                    required 
                    class="input-field"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                >
            </div>

            <div class="flex items-start">
                <div class="flex items-center h-5">
                    <input 
                        id="terms"
                        name="terms"
                        type="checkbox" 
                        required
                        class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                    >
                </div>
                <div class="ml-3 text-sm">
                    <label for="terms" class="font-medium text-gray-700">
                        I agree to the <a href="#" class="text-blue-600 hover:text-blue-500 underline">Terms and Conditions</a> and <a href="#" class="text-blue-600 hover:text-blue-500 underline">Privacy Policy</a>
                    </label>
                </div>
            </div>

            <div>
                <button type="submit" id="registerBtn" class="w-full btn-primary py-3 font-semibold text-base flex items-center justify-center">
                    <span id="registerBtnText">Create Account</span>
                    <svg id="registerSpinner" class="hidden animate-spin ml-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </div>

            <div class="text-center text-sm text-gray-600">
                Already have an account? 
                <a href="/login.html" class="font-medium text-blue-600 hover:text-blue-500">Sign in</a>
            </div>
        </form>
    </div>

    <script type="module" src="/js/auth.js"></script>
</body>
</html>
