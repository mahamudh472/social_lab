<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialApp - Edit Profile</title>
    <link href="./css/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content -->
    <div class="pt-16 pb-8">
        <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="card p-6">
                <h1 class="text-2xl font-bold text-gray-900 mb-6">Edit Profile</h1>
                
                <form id="editProfileForm" class="space-y-6">
                    <!-- Profile Picture -->
                    <div class="flex items-center space-x-6">
                        <img 
                            src="/images/placeholder-avatar.jpg" 
                            alt="Profile" 
                            class="w-20 h-20 rounded-full object-cover"
                            id="profileImagePreview"
                        >
                        <div>
                            <label for="profile_picture" class="btn-secondary cursor-pointer">
                                Change Photo
                            </label>
                            <input 
                                type="file" 
                                id="profile_picture" 
                                name="profile_picture" 
                                accept="image/*" 
                                class="hidden"
                            >
                        </div>
                    </div>

                    <!-- Username -->
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            value="johndoe" 
                            class="input-field"
                        >
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            value="john@example.com" 
                            class="input-field"
                        >
                    </div>

                    <!-- Bio -->
                    <div>
                        <label for="bio" class="block text-sm font-medium text-gray-700 mb-1">Bio</label>
                        <textarea 
                            id="bio" 
                            name="bio" 
                            rows="4" 
                            class="input-field"
                            placeholder="Tell everyone about yourself..."
                        >Digital creator • Photography enthusiast • Travel lover</textarea>
                    </div>

                    <!-- Website -->
                    <div>
                        <label for="website" class="block text-sm font-medium text-gray-700 mb-1">Website</label>
                        <input 
                            type="url" 
                            id="website" 
                            name="website" 
                            value="www.johndoe.com" 
                            class="input-field"
                            placeholder="https://example.com"
                        >
                    </div>

                    <!-- Submit Buttons -->
                    <div class="flex space-x-4 pt-4">
                        <button type="button" onclick="window.history.back()" class="btn-secondary flex-1">
                            Cancel
                        </button>
                        <button type="submit" class="btn-primary flex-1">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const profileImageInput = document.getElementById('profile_picture');
            const profileImagePreview = document.getElementById('profileImagePreview');
            
            profileImageInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        profileImagePreview.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });
        });
    </script>
</body>
</html>
